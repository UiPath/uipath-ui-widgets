name: Publish SDK package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - multi-file-upload
          - datatable
          - conversational-agent-chat
          - validation-station
          - external-auth
          - pdf-viewer
      beta:
        description: "Check for prerelease/beta versions"
        required: false
        type: boolean
        default: false
      github_packages_only:
        description: "Publish only to GitHub Packages (skip npm and Storybook deploy)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    # Dev builds publish to GitHub Packages only and skip the admin-approval
    # gate by running in an unprotected environment; official releases keep
    # the protected `production` environment.
    environment: ${{ inputs.github_packages_only && 'github-packages-dev' || 'production' }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Print publish info
        run: |
          VERSION=$(node -p "require('./packages/${{ inputs.package }}/package.json').version")
          echo "Package: ${{ inputs.package }}"
          echo "Version: $VERSION"
          if [ "${{ inputs.github_packages_only }}" = "true" ]; then
            echo "Mode: GitHub Packages only (npm and Storybook deploy skipped; tag: dev)"
          else
            TAG=$([ "${{ inputs.beta }}" = "true" ] && echo "beta" || echo "latest")
            echo "Tag: $TAG"
          fi

      - name: Validate prerelease version
        if: ${{ inputs.github_packages_only }}
        run: |
          VERSION=$(node -p "require('./packages/${{ inputs.package }}/package.json').version")
          if [[ "$VERSION" != *-* ]]; then
            echo "::error::github_packages_only=true requires a prerelease version (e.g. 1.2.3-dev.0), but packages/${{ inputs.package }} version is $VERSION"
            exit 1
          fi

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@uipath"

      - name: Ensure npm >= 11.5.0 (required for minimum-release-age)
        # Deliberate global npm upgrade (enables `minimum-release-age` supply-chain
        # hardening), not an ad-hoc dependency install — suppress zizmor's heuristic.
        run: npm install -g npm@^11.5.0 # zizmor: ignore[adhoc-packages]

      - name: Install Dependencies
        run: npm install --include=optional --legacy-peer-deps

      - name: Build
        working-directory: packages/${{ inputs.package }}
        run: npm run build

      - name: Build Storybook
        if: ${{ !inputs.github_packages_only }}
        run: npm run build-storybook

      - name: Deploy Storybook to GitHub Pages
        if: ${{ !inputs.github_packages_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          npx gh-pages -d storybook-static -b gh-pages

      - name: Publish to GitHub Packages
        working-directory: packages/${{ inputs.package }}
        run: npm publish --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ inputs.github_packages_only && 'dev' || 'latest' }}

      - name: Setup Node.js for npm
        if: ${{ !inputs.github_packages_only }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@uipath"

      - name: Publish to npm
        if: ${{ !inputs.github_packages_only }}
        working-directory: packages/${{ inputs.package }}
        run: |
          if [ "${{ inputs.beta }}" = "true" ]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
