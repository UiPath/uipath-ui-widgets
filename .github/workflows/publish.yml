name: Publish SDK package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - multi-file-upload
          - datatable
          - conversational-agent-chat
          - validation-station
          - external-auth
          - pdf-viewer
      tag:
        description: |-
          · latest: stable release to npm + GitHub Packages and Storybook deploy (needs approval)
          · beta: prerelease to npm + GitHub Packages under the beta dist-tag (needs approval)
          · dev: internal prerelease to GitHub Packages only, npm and Storybook skipped (no approval)
        required: true
        type: choice
        default: latest
        options:
          - latest
          - beta
          - dev

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish-sdk:
    runs-on: uipath-ubuntu-latest
    # Dev builds publish to GitHub Packages only and skip the admin-approval
    # gate by running in an unprotected environment; latest/beta releases
    # keep the protected `production` environment.
    environment: ${{ inputs.tag == 'dev' && 'github-packages-dev' || 'production' }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # uipath-ubuntu-* runners have less RAM than ubuntu-latest, so Node
      # auto-sizes its heap to ~2 GB and the Storybook build OOMs (exit 134).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Print publish info
        run: |
          VERSION=$(node -p "require('./packages/${{ inputs.package }}/package.json').version")
          echo "Package: ${{ inputs.package }}"
          echo "Version: $VERSION"
          echo "Tag: ${{ inputs.tag }}"
          if [ "${{ inputs.tag }}" = "dev" ]; then
            echo "Mode: GitHub Packages only (npm and Storybook deploy skipped)"
          fi

      - name: Validate version matches the chosen tag
        run: |
          VERSION=$(node -p "require('./packages/${{ inputs.package }}/package.json').version")
          if [ "${{ inputs.tag }}" = "latest" ] && [[ "$VERSION" == *-* ]]; then
            echo "::error::tag=latest requires a stable version, but packages/${{ inputs.package }} version is $VERSION — publish prereleases under beta or dev"
            exit 1
          fi
          if [ "${{ inputs.tag }}" != "latest" ] && [[ "$VERSION" != *-* ]]; then
            echo "::error::tag=${{ inputs.tag }} requires a prerelease version (e.g. 1.2.3-beta.0), but packages/${{ inputs.package }} version is $VERSION"
            exit 1
          fi

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@uipath"

      - name: Ensure npm >= 11.5.0 (required for minimum-release-age)
        # Deliberate global npm upgrade (enables `minimum-release-age` supply-chain
        # hardening), not an ad-hoc dependency install — suppress zizmor's heuristic.
        run: npm install -g npm@^11.5.0 # zizmor: ignore[adhoc-packages]

      - name: Install Dependencies
        run: npm install --include=optional --legacy-peer-deps

      - name: Build
        working-directory: packages/${{ inputs.package }}
        run: npm run build

      - name: Build Storybook
        if: ${{ inputs.tag != 'dev' }}
        run: npm run build-storybook

      - name: Deploy Storybook to GitHub Pages
        if: ${{ inputs.tag != 'dev' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          npx gh-pages -d storybook-static -b gh-pages

      - name: Publish to GitHub Packages
        working-directory: packages/${{ inputs.package }}
        run: npm publish --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ inputs.tag }}

      - name: Setup Node.js for npm
        if: ${{ inputs.tag != 'dev' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@uipath"

      - name: Publish to npm
        if: ${{ inputs.tag != 'dev' }}
        working-directory: packages/${{ inputs.package }}
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ inputs.tag }}
