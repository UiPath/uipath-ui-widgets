name: Build and Deploy Storybook

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_NPM_REGISTRY_TOKEN: ${{ secrets.GH_NPM_REGISTRY_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_NPM_REGISTRY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          # Use npm install to ensure optional dependencies (like lightningcss native binaries) are installed
          npm install --include=optional --legacy-peer-deps
          # Rebuild native modules to ensure platform-specific binaries are available
          npm rebuild lightningcss --include=optional || true

      - name: Build packages
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          npx gh-pages -d storybook-static -b gh-pages
