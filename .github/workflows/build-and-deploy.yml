name: Build and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  packages: write

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGES: datatable multi-file-upload conversational-agent-chat

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@uipath'

      - name: Install dependencies
        run: npm install --include=optional --legacy-peer-deps

      - name: Build packages
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      # ===== Publish (only on push to main/develop) =====
      - name: Detect changed packages
        if: github.event_name == 'push'
        id: changed
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          CHANGED_PACKAGES=""
          for pkg in $PACKAGES; do
            echo "$CHANGED_FILES" | grep -q "^packages/$pkg/" && CHANGED_PACKAGES="$CHANGED_PACKAGES $pkg"
          done
          echo "packages=$CHANGED_PACKAGES"
          echo "packages=$CHANGED_PACKAGES" >> $GITHUB_OUTPUT

      - name: Version and Publish
        if: github.event_name == 'push' && steps.changed.outputs.packages != ''
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          for PACKAGE in ${{ steps.changed.outputs.packages }}; do
            cd packages/$PACKAGE
            if [ "${{ github.ref_name }}" = "develop" ]; then
              npm version prerelease --preid=dev.${SHORT_SHA} --no-git-tag-version
              npm publish --tag dev || true
            else
              npm version patch --no-git-tag-version
              npm publish --tag latest || true
            fi
            cd ../..
          done

      # ===== Deploy Storybook (only on push to main/develop) =====
      - name: Deploy to gh-pages
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d storybook-static -b gh-pages
