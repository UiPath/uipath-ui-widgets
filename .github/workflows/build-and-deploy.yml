name: Build and Deploy

on:
  push:
    branches: [release/*, develop]
  pull_request:
    branches: [release/*, develop]

permissions:
  contents: write
  packages: write

concurrency:
  group: "ci-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGES: datatable multi-file-upload conversational-agent-chat

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@uipath"

      - name: Install dependencies
        run: npm install --include=optional --legacy-peer-deps

      - name: Build packages
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      # ===== Release: Version, Publish, and Deploy (only on push to release/*) =====
      - name: Release and deploy
        if: github.event_name == 'push' && startsWith(github.ref_name, 'release/')
        run: |
          npx changeset version
          npx changeset publish
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add .changeset packages/*/CHANGELOG.md packages/*/package.json
          git diff --staged --quiet || git commit -m "chore: version packages [skip ci]"
          git push
          npx gh-pages -d storybook-static -b gh-pages -u "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
